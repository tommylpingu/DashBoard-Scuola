<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Scolastica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-bar">
    <h1 id="titolo-pagina">Orario Settimanale</h1>
    
    <!-- Icona di navigazione animata -->
    <button id="btn-switch" class="nav-icon" title="Passa ai Voti">
      <span class="icon-text">Valutazioni</span> 
    </button>
  </header>

  <main class="container">
    
    <!-- SEZIONE 1: ORARIO -->
    <section id="sezione-orario" class="page-section active">
      <table id="tabella-orario">
        <thead>
          <tr>
            <th>Ora</th>
            <th>Lunedì</th>
            <th>Martedì</th>
            <th>Mercoledì</th>
            <th>Giovedì</th>
            <th>Venerdì</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1ª Ora</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
          </tr>
          <tr>
            <td>2ª Ora</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
          </tr>
          <tr>
            <td>3ª Ora</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
          </tr>
          <tr>
            <td>4ª Ora</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
          </tr>
          <tr>
            <td>5ª Ora</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
          </tr>
          <tr>
            <td>6ª Ora</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
            <td class="materia">--</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- SEZIONE 2: VOTI -->
    <!-- SEZIONE 2: VOTI -->
    <section id="sezione-voti" class="page-section hidden">
      <div class="voti-container">
        <h2>Registro Voti</h2>

        <!-- Form per aggiungere i voti -->
        <form id="form-voto">
          <select id="materia-select" required>
            <option value="">Seleziona materia</option>
            <option value="Matematica">Matematica</option>
            <option value="Informatica">Informatica</option>
          </select>
          <input type="number" id="voto-input" min="2" max="10" step="0.5" placeholder="Voto" required>
          <button type="submit">Salva Voto</button>
        </form>

        <!-- Nuova Tabella dei Voti per Materia -->
        <div class="tabella-voti-container">
          <table id="tabella-voti">
            <thead>
              <tr>
                <th>Materia</th>
                <th>Voti Inseriti</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="nome-materia">Matematica</td>
                <td id="voti-matematica" class="elenco-voti">--</td>
              </tr>
              <tr>
                <td class="nome-materia">Informatica</td>
                <td id="voti-informatica" class="elenco-voti">--</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Riquadro Media Generale -->
        <div class="media-box">
          <h3>Media Generale</h3>
          <span id="media-valore">--</span>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
